<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>擬真 3D 釣魚</title><style>
body{margin:0;overflow:hidden;background:#000;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;user-select:none;color:#fff}canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:rgba(10,20,30,.55);backdrop-filter:blur(6px);padding:8px 16px;border-radius:12px;font-size:14px;white-space:nowrap}
#bar{position:fixed;top:52px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button,select{padding:6px 12px;border:0;border-radius:8px;background:#ffb300;font-weight:bold;cursor:pointer;font-family:inherit}select{background:#fff}
#msg{position:fixed;bottom:70px;width:100%;text-align:center;font-size:20px;text-shadow:0 2px 6px #000;pointer-events:none}
#help{position:fixed;bottom:10px;width:100%;text-align:center;font-size:12px;opacity:.75;text-shadow:0 1px 3px #000;pointer-events:none}
#pow{display:none;position:fixed;bottom:110px;left:50%;width:260px;margin-left:-130px;height:14px;background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden}#powf{height:100%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#f44336)}
#ten{display:none;position:fixed;right:30px;top:50%;margin-top:-120px;width:22px;height:240px;background:rgba(0,0,0,.5);border-radius:11px;overflow:hidden;border:2px solid rgba(255,255,255,.4)}#tenf{position:absolute;bottom:0;width:100%}#ten:before{content:'';position:absolute;top:0;width:100%;height:20%;background:rgba(255,0,0,.3)}#ten:after{content:'張力';position:absolute;bottom:-24px;left:-4px;font-size:12px}
#dist{position:fixed;top:92px;width:100%;text-align:center;text-shadow:0 1px 4px #000;pointer-events:none}
#shop{display:none;position:fixed;inset:5% 20%;background:rgba(14,24,34,.95);border-radius:14px;overflow:auto;padding:14px 20px;font-size:14px;box-shadow:0 10px 40px #000}.top{display:flex;justify-content:space-between;font-size:20px}.it{display:flex;justify-content:space-between;align-items:center;padding:7px;border-bottom:1px solid #345}.it.own{color:#8f8}h4{margin:12px 0 4px;color:#ffcc80}
#catch{display:none;position:fixed;top:18%;width:100%;text-align:center;font-size:26px;text-shadow:0 2px 8px #000;pointer-events:none}
#toast{position:fixed;top:130px;width:100%;text-align:center;font-size:18px;opacity:0;transition:opacity .5s;text-shadow:0 2px 6px #000;pointer-events:none}
#flash{position:fixed;inset:0;background:#dde8ff;opacity:0;pointer-events:none}
#joy{display:none;position:fixed;left:30px;bottom:40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);touch-action:none}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.6)}#ebtn{display:none;position:fixed;left:170px;bottom:50px}.touch #joy,.touch #ebtn{display:block}</style></head><body>
<div id="flash"></div><div id="hud"></div><div id="bar"><button onclick="openShop()">🏪 商店</button><button onclick="sellAll()">💰 全部賣出</button><select id="bs"></select></div>
<div id="msg"></div><div id="toast"></div><div id="catch"></div><div id="pow"><div id="powf"></div></div><div id="ten"><div id="tenf"></div></div><div id="dist"></div>
<div id="help">按住滑鼠／空白鍵蓄力，放開拋竿｜浮標下沉時快點擊｜按住收線，注意張力條｜拖曳轉動視角｜WASD／方向鍵走動（Shift 跑）｜E 上下船</div><div id="shop"></div><div id="joy"><div id="knob"></div></div><button id="ebtn">E 上/下船</button>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script><script type="module" src="game.js"></script></body></html>
